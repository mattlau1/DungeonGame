apiVersion: v1
kind: Secret
metadata:
  name: dungeon-secrets
type: Opaque
data:
  db-password: ZHVuZ2Vvbl9wYXNzd29yZA==
  redis-password: cmVkaXNfcGFzc3dvcmQ=
---
apiVersion: v1
kind: Service
metadata:
  name: dungeon-server-grpc
spec:
  type: ClusterIP
  selector:
    app: dungeon-server
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dungeon-server-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dungeon-server-grpc
            port:
              number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dungeon-server
spec:
  type: ClusterIP
  selector:
    app: dungeon-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dungeon-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dungeon-server
  template:
    metadata:
      labels:
        app: dungeon-server
    spec:
      containers:
      - name: dungeon-server
        image: dungeon-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ASPNETCORE_ENVIRONMENT
          value: "Development"
        - name: DB_HOST
          value: "postgres-postgresql"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "dungeon_db"
        - name: DB_USER
          value: "dungeon_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dungeon-secrets
              key: db-password
        - name: REDIS_HOST
          value: "redis-master"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dungeon-secrets
              key: redis-password
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dungeon-benchmark
spec:
  type: ClusterIP
  selector:
    app: dungeon-benchmark
  ports:
  - name: dashboard
    port: 9092
    targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dungeon-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dungeon-benchmark
  template:
    metadata:
      labels:
        app: dungeon-benchmark
    spec:
      containers:
      - name: benchmark
        image: dungeon-benchmark:latest
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        env:
        - name: BENCHMARK_SERVER_URL
          value: "http://dungeon-server-grpc:8080"
        - name: BENCHMARK_DASHBOARD_PORT
          value: "9092"
        ports:
        - containerPort: 9092
