services:
  dungeon-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5142:8080"
      - "5143:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=dungeon_db
      - DB_USER=dungeon_user
      - DB_PASSWORD=dungeon_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  benchmark-runner:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    ports:
      - "9092:9092"
    environment:
      - BENCHMARK_SERVER_URL=http://dungeon-server:8080
      - BENCHMARK_DASHBOARD_PORT=9092
    depends_on:
      dungeon-server:
        condition: service_started

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: dungeon_user
      POSTGRES_PASSWORD: dungeon_password
      POSTGRES_DB: dungeon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c max_connections=1000
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dungeon_user -d dungeon_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-insight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "9091:5540"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
